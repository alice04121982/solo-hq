  <circle cx="16" cy="6.5" r="2.2" fill="#C5E600"/>
  <rect x="13" y="10" width="8" height="4" rx="2" fill="#FBF2EB"/>
  <rect x="8.5" y="15" width="12" height="4" rx="2" fill="#FBF2EB"/>
  <rect x="10" y="20" width="16" height="4" rx="2" fill="#FBF2EB"/>
  <rect x="5.5" y="25" width="21" height="4" rx="2" fill="#FBF2EB"/>
</svg>
