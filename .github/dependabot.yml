# Keeps the two things that drift on their own current: npm dependencies and
# the pinned Actions in the workflows. The August 2026 review left npm audit
# at zero; four weeks later Next.js carried a critical advisory. A weekly
# pull request is cheaper than finding that out in an audit.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/London
    open-pull-requests-limit: 5
    ignore:
      # eslint-config-next bundles typescript-eslint (TypeScript <6.1 only) and
      # eslint-plugin-react (ESLint 9 API), so a major bump of either breaks
      # `npm run lint`. Lift these once eslint-config-next supports them.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      # Next and its ESLint config move together; a mismatch fails the build.
      next:
        patterns: ["next", "eslint-config-next"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/London
