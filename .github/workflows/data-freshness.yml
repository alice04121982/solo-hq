# Guards the treatment data in src/lib/clinics.ts: structural invariants on
# every push/PR that touches it, plus a weekly staleness check that opens (or
# refreshes) an issue when prices haven't been re-verified recently. The
# re-verification itself is a human-or-agent job — see
# .claude/skills/treatment-data-check/SKILL.md.
name: Treatment data freshness

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "src/lib/clinics.ts"
      - "src/types/clinic.ts"
      - "scripts/check-data.ts"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "src/lib/clinics.ts"
      - "src/types/clinic.ts"
      - "scripts/check-data.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read
  issues: write

jobs:
  # A new advisory in a production dependency fails the build, so it is seen
  # the week it lands rather than at the next audit. Dev-only advisories are
  # left to Dependabot's pull requests. Reads the lockfile; no install needed.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Fail on a high or critical advisory in production dependencies
        run: npm audit --omit=dev --audit-level=high

  check-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check treatment data integrity and freshness
        id: check
        run: npm run check:data 2>&1 | tee check-output.txt
      - name: Open or update staleness issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('check-output.txt')
              ? fs.readFileSync('check-output.txt', 'utf8').slice(-4000)
              : 'No output captured.';
            const title = 'Treatment data needs re-verification';
            const body = [
              'The scheduled data check failed. Prices and treatment data in `src/lib/clinics.ts` are stale or inconsistent.',
              '',
              'To fix: run the `treatment-data-check` skill (`.claude/skills/treatment-data-check/SKILL.md`) — it walks through re-verifying every figure against clinic price lists and the HFEA/NHS benchmarks, then updating `DATA_PROVENANCE.pricesVerifiedOn`.',
              '',
              '```',
              output,
              '```',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-freshness',
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing as of ${new Date().toISOString().slice(0, 10)}.\n\n\`\`\`\n${output}\n\`\`\``,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['data-freshness'],
              });
            }
