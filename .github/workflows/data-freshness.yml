# Guards the treatment data in src/lib/clinics.ts: structural invariants on
# every push/PR that touches it, plus a weekly staleness check that opens (or
# refreshes) an issue when prices haven't been re-verified recently. The
# re-verification itself is a human-or-agent job — see
# .claude/skills/treatment-data-check/SKILL.md.
name: Treatment data freshness

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "src/lib/clinics.ts"
      - "src/types/clinic.ts"
      - "scripts/check-data.ts"
  push:
    branches: [main]
    paths:
      - "src/lib/clinics.ts"
      - "src/types/clinic.ts"
      - "scripts/check-data.ts"

permissions:
  contents: read
  issues: write

jobs:
  check-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check treatment data integrity and freshness
        id: check
        run: npm run check:data 2>&1 | tee check-output.txt
      - name: Open or update staleness issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('check-output.txt')
              ? fs.readFileSync('check-output.txt', 'utf8').slice(-4000)
              : 'No output captured.';
            const title = 'Treatment data needs re-verification';
            const body = [
              'The scheduled data check failed. Prices and treatment data in `src/lib/clinics.ts` are stale or inconsistent.',
              '',
              'To fix: run the `treatment-data-check` skill (`.claude/skills/treatment-data-check/SKILL.md`) — it walks through re-verifying every figure against clinic price lists and the HFEA/NHS benchmarks, then updating `DATA_PROVENANCE.pricesVerifiedOn`.',
              '',
              '```',
              output,
              '```',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-freshness',
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing as of ${new Date().toISOString().slice(0, 10)}.\n\n\`\`\`\n${output}\n\`\`\``,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['data-freshness'],
              });
            }
